name: Deploy wyrd

on:
  push:
    branches: [main]        # → staging auto-deploy
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write  # OIDC

env:
  AWS_REGION: us-east-2
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  TF_VERSION: "1.9.0"

jobs:
  # ── Staging: auto on push to main, or manual dispatch from any branch ─────────

  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    env:
      TF_STATE_BUCKET: 521studios-infra-tfstate-242288027927
      S3_BUCKET: 521studios-staging-wyrd-spa
      SITE_DOMAIN: wyrd.staging.521studios.com

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: wyrd-deploy-staging

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build Lambda zip
        run: bin/build-lambda.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=wyrd/staging/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        # LOG_LEVEL=DEBUG on staging surfaces the per-request + per-phase
        # timing logs Kenning.generate emits — left to default INFO on
        # production. Flip in terraform/variables.tf if staging needs
        # to go quieter.
        run: terraform apply -auto-approve -input=false -var="env=staging" -var="log_level=DEBUG"

      - name: Update Lambda code
        working-directory: terraform
        run: |
          FUNCTION=$(terraform output -raw lambda_function_name)
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://../function.zip \
            --architectures arm64
          aws lambda wait function-updated --function-name "$FUNCTION"

      # wyrd-20pz: Vite SPA build needs Node. Sourced from spa-next/
      # via deploy-spa.sh (npm ci + npm run build + aws s3 sync).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spa-next/package-lock.json

      - name: Upload SPA to S3
        run: bin/deploy-spa.sh "${{ env.S3_BUCKET }}"

      - name: Invalidate CloudFront
        run: bin/invalidate-cloudfront.sh "${{ env.SITE_DOMAIN }}"

  # ── Production: manual dispatch only ──────────────────────────────────────

  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production

    env:
      TF_STATE_BUCKET: 521studios-infra-tfstate-242258465702
      S3_BUCKET: 521studios-production-wyrd-spa
      SITE_DOMAIN: wyrd.521studios.com

    steps:
      - uses: actions/checkout@v6

      - name: Require main branch for production
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Production deploys must be triggered from the main branch (got: ${{ github.ref }})"
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: wyrd-deploy-production

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build Lambda zip
        run: bin/build-lambda.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=wyrd/production/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var="env=production"

      - name: Update Lambda code
        working-directory: terraform
        run: |
          FUNCTION=$(terraform output -raw lambda_function_name)
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://../function.zip \
            --architectures arm64
          aws lambda wait function-updated --function-name "$FUNCTION"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spa-next/package-lock.json

      - name: Upload SPA to S3
        run: bin/deploy-spa.sh "${{ env.S3_BUCKET }}"

      - name: Invalidate CloudFront
        run: bin/invalidate-cloudfront.sh "${{ env.SITE_DOMAIN }}"
