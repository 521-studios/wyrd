name: Deploy wyrd

on:
  push:
    branches: [main]        # → staging auto-deploy
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

# wyrd-8f1p: serialize deploys per environment so two near-simultaneous
# pushes to main (or a push racing a dispatch) don't run overlapping
# `tofu apply` + Lambda `UpdateFunctionCode` against the same function —
# which fails the second with a 409 ResourceConflictException. The group key
# resolves to the target env: push → 'staging', dispatch → the chosen input.
# cancel-in-progress: false lets an in-flight apply/update finish (never
# cancelled mid-deploy); a newer run queues and supersedes any other pending
# one, so the latest code still deploys.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # OIDC

env:
  AWS_REGION: us-east-2
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  TF_VERSION: "1.9.0"

jobs:
  # ── Staging: auto on push to main, or manual dispatch from any branch ─────────

  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    env:
      TF_STATE_BUCKET: 521studios-infra-tfstate-242288027927
      S3_BUCKET: 521studios-staging-wyrd-spa
      SITE_DOMAIN: wyrd.staging.521studios.com

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: wyrd-deploy-staging

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build Lambda zip
        run: bin/build-lambda.sh

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          tofu init \
            -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=wyrd/staging/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        # LOG_LEVEL=DEBUG on staging surfaces the per-request + per-phase
        # timing logs Kenning.generate emits — left to default INFO on
        # production. Flip in terraform/variables.tf if staging needs
        # to go quieter.
        # wyrd-ocs8: SnapStart is gated on the repo variable
        # ENABLE_STAGING_SNAPSTART (default false → apply_on=None). Safe to flip
        # on now that the "Prune old Lambda versions" step below is active
        # (ENABLE_STAGING_VERSION_PRUNE), so snapshots stay bounded to
        # current + prior instead of accumulating per-version (the incident).
        run: tofu apply -auto-approve -input=false -var="env=staging" -var="log_level=DEBUG" -var="enable_snapstart=${{ vars.ENABLE_STAGING_SNAPSTART || 'false' }}"

      - name: Wait for SnapStart snapshot Active
        working-directory: terraform
        # wyrd-g1wp: `tofu apply` (publish=true + snap_start) deployed the
        # code from function.zip, published a version with a SnapStart snapshot,
        # and repointed the `live` alias at it (the Function URL serves through
        # `live`). This replaces the old `update-function-code` step — terraform
        # now owns code + publish + alias. A published version isn't invocable
        # until its snapshot finishes optimizing, so block until State=Active.
        run: |
          FUNCTION=$(tofu output -raw lambda_function_name)
          VERSION=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          echo "live alias → version $VERSION; waiting for State=Active (SnapStart optimization)…"
          OK=
          for _ in $(seq 1 90); do
            CFG=$(aws lambda get-function-configuration --function-name "$FUNCTION" --qualifier "$VERSION" --query '[State,LastUpdateStatus]' --output text 2>/dev/null || printf 'Pending\tInProgress')
            echo "  v$VERSION: $CFG"
            [ "$CFG" = "$(printf 'Active\tSuccessful')" ] && { OK=1; break; }
            sleep 10
          done
          [ "$OK" = 1 ] || { echo "::error::version $VERSION not Active+Successful after wait"; exit 1; }

      - name: Prune old Lambda versions (keep current + prior)
        working-directory: terraform
        # wyrd-ocs8: same retention as the production job, but INACTIVE by
        # default — gated on the repo variable ENABLE_STAGING_VERSION_PRUNE.
        # Staging auto-deploys on every push, so this would prune aggressively;
        # it stays off until deliberately enabled (set the repo/Actions variable
        # ENABLE_STAGING_VERSION_PRUNE=true — no code change needed). Best-effort;
        # a prune failure must not strand the SPA on an old build.
        if: vars.ENABLE_STAGING_VERSION_PRUNE == 'true'
        continue-on-error: true
        env:
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "15"
        run: |
          FUNCTION=$(tofu output -raw lambda_function_name)
          ALIAS_V=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          ALL=$(aws lambda list-versions-by-function --function-name "$FUNCTION" --query "Versions[?Version!='\$LATEST'].Version" --output text | tr '\t' '\n' | sort -rn)
          KEEP=$(printf '%s\n' "$ALL" | head -2)
          echo "alias→v$ALIAS_V; keeping newest 2 ($(echo $KEEP)) + alias"
          for v in $ALL; do
            if ! printf '%s\n' "$KEEP" | grep -qx "$v" && [ "$v" != "$ALIAS_V" ]; then
              aws lambda delete-function --function-name "$FUNCTION" --qualifier "$v" && echo "pruned v$v"
            fi
          done

      # wyrd-20pz: Vite SPA build needs Node. Sourced from spa-next/
      # via deploy-spa.sh (npm ci + npm run build + aws s3 sync).
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spa-next/package-lock.json

      - name: Upload SPA to S3
        run: bin/deploy-spa.sh "${{ env.S3_BUCKET }}"

      - name: Invalidate CloudFront
        run: bin/invalidate-cloudfront.sh "${{ env.SITE_DOMAIN }}"

  # ── Production: manual dispatch only ──────────────────────────────────────

  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production

    env:
      TF_STATE_BUCKET: 521studios-infra-tfstate-242258465702
      S3_BUCKET: 521studios-production-wyrd-spa
      SITE_DOMAIN: wyrd.521studios.com

    steps:
      - uses: actions/checkout@v7

      - name: Require main branch for production
        if: github.ref != 'refs/heads/main'
        run: |
          echo "❌ Production deploys must be triggered from the main branch (got: ${{ github.ref }})"
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: wyrd-deploy-production

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build Lambda zip
        run: bin/build-lambda.sh

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          tofu init \
            -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=wyrd/production/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        run: tofu apply -auto-approve -input=false -var="env=production"

      - name: Wait for SnapStart snapshot Active
        working-directory: terraform
        # wyrd-g1wp: `tofu apply` (publish=true + snap_start) deployed the
        # code from function.zip, published a version with a SnapStart snapshot,
        # and repointed the `live` alias at it (the Function URL serves through
        # `live`). This replaces the old `update-function-code` step — terraform
        # now owns code + publish + alias. A published version isn't invocable
        # until its snapshot finishes optimizing, so block until State=Active.
        run: |
          FUNCTION=$(tofu output -raw lambda_function_name)
          VERSION=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          echo "live alias → version $VERSION; waiting for State=Active (SnapStart optimization)…"
          OK=
          for _ in $(seq 1 90); do
            CFG=$(aws lambda get-function-configuration --function-name "$FUNCTION" --qualifier "$VERSION" --query '[State,LastUpdateStatus]' --output text 2>/dev/null || printf 'Pending\tInProgress')
            echo "  v$VERSION: $CFG"
            [ "$CFG" = "$(printf 'Active\tSuccessful')" ] && { OK=1; break; }
            sleep 10
          done
          [ "$OK" = 1 ] || { echo "::error::version $VERSION not Active+Successful after wait"; exit 1; }

      - name: Prune old Lambda versions (keep current + prior)
        working-directory: terraform
        # Best-effort cleanup: a prune failure must not strand the SPA on an old
        # build (this runs before the SPA upload + CloudFront invalidation).
        continue-on-error: true
        # wyrd-ocs8: bound the published-version count to current + prior (one
        # rollback target). publish=true cuts a version per deploy; unchecked they
        # accumulate, and each caches a 1769MB SnapStart snapshot when SnapStart
        # is on — the 2026-06-22 cost blowout. Keep the 2 newest numeric versions
        # plus whatever `live` points at (rollback-safe); delete the rest.
        env:
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: "15"
        run: |
          FUNCTION=$(tofu output -raw lambda_function_name)
          ALIAS_V=$(aws lambda get-alias --function-name "$FUNCTION" --name live --query FunctionVersion --output text)
          ALL=$(aws lambda list-versions-by-function --function-name "$FUNCTION" --query "Versions[?Version!='\$LATEST'].Version" --output text | tr '\t' '\n' | sort -rn)
          KEEP=$(printf '%s\n' "$ALL" | head -2)
          echo "alias→v$ALIAS_V; keeping newest 2 ($(echo $KEEP)) + alias"
          for v in $ALL; do
            if ! printf '%s\n' "$KEEP" | grep -qx "$v" && [ "$v" != "$ALIAS_V" ]; then
              aws lambda delete-function --function-name "$FUNCTION" --qualifier "$v" && echo "pruned v$v"
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spa-next/package-lock.json

      - name: Upload SPA to S3
        run: bin/deploy-spa.sh "${{ env.S3_BUCKET }}"

      - name: Invalidate CloudFront
        run: bin/invalidate-cloudfront.sh "${{ env.SITE_DOMAIN }}"
