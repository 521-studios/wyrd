[project]
name = "wyrd"
version = "0.1.0"
description = "Random-generation service for TTRPG"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "click>=8.1",
    "apig-wsgi>=2.18",
    # wyrd-g1wp: AWS Lambda SnapStart runtime hooks (register_after_restore) to
    # drop the snapshot's stale sqlite connection on cold restore. Import is
    # guarded (wyrd/snapstart.py) so non-Lambda paths that lack it still run.
    "snapshot-restore-py>=1.0",
    # wyrd-0vj3: S3 + zstd handling for bulk-source sync. Both imports
    # live behind ``lexicon fetch-bulk-sources`` / ``push-bulk-sources``
    # / ``verify-bulk-sources`` and the ``.jsonl.zst`` reader in
    # ``ingest-wiktionary``, so other CLI paths pay no startup cost.
    "boto3>=1.34",
    "zstandard>=0.22",
    # wyrd-kq7w.2: PyYAML reads the operator-edited
    # register_effects.yaml catalog (kenning/data/register_effects.yaml).
    # YAML over JSON for nested-dict readability when an operator
    # hand-edits the catalog; load is lazy (only fires on first
    # register-effect access) so cold-start cost is paid only when a
    # --register flag is used.
    "PyYAML>=6.0",
    # wyrd-67fv: SQLAlchemy Core for the lexicon's query builder and
    # table metadata; alembic for layered schema migrations. Lexicon is
    # authoring-side only — the Lambda runtime reads the bundled
    # meanings.json and never touches lexicon code, so neither dep
    # affects cold-start. Both ship aarch64 manylinux wheels (SA) /
    # pure-python (alembic), so they pass the Lambda build's
    # ``--only-binary=:all: --platform manylinux2014_aarch64`` gate
    # regardless.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# wyrd-el93: pure-Python reader for Hull's Domesday MDB files
# (Microsoft Access format). Used only by ``lexicon ingest-domesday``,
# which is an operator-only command — not needed at Lambda runtime.
# Kept out of base ``dependencies`` because the published wheels for
# >=0.0.5 ship sdist-only / non-aarch64 binaries, breaking the
# Lambda build pipeline's ``--only-binary=:all: --platform
# manylinux2014_aarch64 --python-version 3.12`` constraint (caught
# at wyrd-j43l deploy-gate; all deploys had silently failed since
# wyrd-el93 PR #174 landed access_parser as a required dep).
# Operators running ingest-domesday install via
# ``pip install -e '.[ingest]'``.
ingest = [
    "access_parser>=0.0.6",
]
dev = [
    "pytest>=8.0",
    # wyrd CI: parallel test execution (`pytest -n auto`). The suite is
    # ~5.6k tests and the serial run dominated CI at ~18 min; xdist fans it
    # across the runner's cores. Tests are isolated via tmp_path / in-memory
    # DBs + the autouse _isolate_default_lexicon_db / _isolate_bulk_manifest
    # fixtures, so worker distribution is safe.
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    # wyrd-0vj3: moto for offline S3 testing in bulk_sources tests.
    # wyrd-dsl5: moto[dynamodb] for the defects-table tests (defects + CLI).
    "moto[s3,dynamodb]>=5.0",
    "black>=24.0",
    # wyrd-bxum: dead-code gate. >=2.16 for the `# noqa: V1xx` code semantics
    # the [tool.vulture] suppressions below rely on.
    "vulture>=2.16",
]

[project.scripts]
wyrd = "wyrd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wyrd*"]

[tool.setuptools.package-data]
# wyrd-mewu: no *.sql remain in the package data dir — lexicon.sql / runtime.sql
# were relocated to <repo>/data/seed/ (build-time inputs, not bundled).
"wyrd.generators.kenning" = ["data/*.json", "data/*.yaml", "data/*.db"]
"wyrd.generators.kenning.lexicon.sql.migrations" = ["script.py.mako"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# wyrd-850l: PLW1514 (unspecified-encoding) enforces an explicit ``encoding=`` on
# text I/O so the encoding="utf-8" drift #862 normalized can't regress. It's a
# PREVIEW rule on ruff 0.15.x, so ``preview`` must be on; ``explicit-preview-rules``
# caps the NEW-rule blast radius to exactly the codes in ``select`` (only PLW1514
# activates, not every preview-only rule). It does NOT — and cannot — stop
# ``preview`` from ALSO enabling preview-mode behavior on some already-stable rules
# (SIM/UP/F families carry preview extensions); that is inherent to ruff's preview
# flag. So the "no other delta" property is EMPIRICAL, not structural: full
# ``ruff check .`` + ``ruff format --check .`` are byte-identical pre/post on ruff
# 0.15.18 and green on CI's floated ruff — nothing in the repo currently trips those
# preview behaviors. When PLW1514 graduates to stable upstream, drop
# ``preview``/``explicit-preview-rules`` and keep only the select entry (wyrd-y0d0).
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "C901", "PLW1514"]
ignore = ["E501", "SIM108"]
preview = true
explicit-preview-rules = true

# wyrd-8uvi: enforce the McCabe ≤10 floor in CI so reduced functions can't
# regress and new complexity is caught at PR time.
[tool.ruff.lint.mccabe]
max-complexity = 10

# The wyrd-8uvi sweep (+ follow-ups) cleared EVERY over-the-floor function in
# wyrd/generators/kenning/, so the McCabe <=10 floor is now fully enforced
# there with no kenning exceptions. Tests/scripts stay exempt by convention;
# wyrd/defects.py:list_defects (11) is a minor deferred cleanup outside kenning.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]
"scripts/**" = ["C901"]
"wyrd/defects.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dead-code audit: `uvx vulture` (reads this section automatically).
# Scans the product package only — functions whose sole caller is a test
# are reported on purpose (they flag "is this test pinning code nothing
# ships uses?"), so triage hits against `tests/` before deleting.
[tool.vulture]
paths = ["wyrd"]
min_confidence = 60
# Skip alembic migrations: their `upgrade`/`downgrade` are framework
# entry points, never called by name.
exclude = ["*/sql/migrations/*"]
# Callables registered via decorator are invoked by a framework, not by
# name, so vulture can't see the call site. Each entry is a real false
# positive observed in the wild:
#   @event.listens_for — SQLAlchemy connection hooks (e.g. db.py _set_pragmas,
#     which sets foreign_keys / WAL synchronous / row_factory on every connect)
#   @*.route / @*.errorhandler — Flask view + error handlers (wyrd/app.py)
#   @click.* / @*.command / @*.group — Click CLI commands (cli.py, cli_defects.py)
#   @*.fixture — pytest fixtures, if tests/ is ever added to paths
#   @register_after_restore — AWS Lambda SnapStart after-restore hook
#     (wyrd/snapstart.py); invoked by the runtime on restore, not by name
ignore_decorators = [
    "@event.listens_for",
    "@register_after_restore",
    "@*.route",
    "@*.errorhandler",
    # Flask 2.x method shorthands (@app.get/@app.post/...) — app.py uses these
    "@*.get",
    "@*.post",
    "@*.put",
    "@*.patch",
    "@*.delete",
    "@click.*",
    "@*.command",
    "@*.group",
    "@*.fixture",
]
# Deliberate single-symbol keeps are suppressed inline at the definition with
# `# noqa: V103` (vulture respects # noqa; V103 = unused function/method),
# not listed here — keeps the suppression next to the code it protects.
# EXCEPTION: vulture's # noqa is NOT honored on DECORATED methods (it reports
# the decorator line and ignores a noqa on either the decorator or the def), so
# decorated keeps must be listed here by name instead.
ignore_names = [
    "from_in_memory",  # @classmethod in-memory test constructor (SnippetExpander)
]
