[project]
name = "wyrd"
version = "0.1.0"
description = "Random-generation service for TTRPG"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "click>=8.1",
    "apig-wsgi>=2.18",
    # wyrd-0vj3: S3 + zstd handling for bulk-source sync. Both imports
    # live behind ``lexicon fetch-bulk-sources`` / ``push-bulk-sources``
    # / ``verify-bulk-sources`` and the ``.jsonl.zst`` reader in
    # ``ingest-wiktionary``, so other CLI paths pay no startup cost.
    "boto3>=1.34",
    "zstandard>=0.22",
    # wyrd-kq7w.2: PyYAML reads the operator-edited
    # register_effects.yaml catalog (kenning/data/register_effects.yaml).
    # YAML over JSON for nested-dict readability when an operator
    # hand-edits the catalog; load is lazy (only fires on first
    # register-effect access) so cold-start cost is paid only when a
    # --register flag is used.
    "PyYAML>=6.0",
    # wyrd-67fv: SQLAlchemy Core for the lexicon's query builder and
    # table metadata; alembic for layered schema migrations. Lexicon is
    # authoring-side only — the Lambda runtime reads the bundled
    # meanings.json and never touches lexicon code, so neither dep
    # affects cold-start. Both ship aarch64 manylinux wheels (SA) /
    # pure-python (alembic), so they pass the Lambda build's
    # ``--only-binary=:all: --platform manylinux2014_aarch64`` gate
    # regardless.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# wyrd-el93: pure-Python reader for Hull's Domesday MDB files
# (Microsoft Access format). Used only by ``lexicon ingest-domesday``,
# which is an operator-only command — not needed at Lambda runtime.
# Kept out of base ``dependencies`` because the published wheels for
# >=0.0.5 ship sdist-only / non-aarch64 binaries, breaking the
# Lambda build pipeline's ``--only-binary=:all: --platform
# manylinux2014_aarch64 --python-version 3.12`` constraint (caught
# at wyrd-j43l deploy-gate; all deploys had silently failed since
# wyrd-el93 PR #174 landed access_parser as a required dep).
# Operators running ingest-domesday install via
# ``pip install -e '.[ingest]'``.
ingest = [
    "access_parser>=0.0.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # wyrd-0vj3: moto for offline S3 testing in bulk_sources tests.
    # wyrd-dsl5: moto[dynamodb] for the defects-table tests (defects + CLI).
    "moto[s3,dynamodb]>=5.0",
    "black>=24.0",
]

[project.scripts]
wyrd = "wyrd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wyrd*"]

[tool.setuptools.package-data]
"wyrd.generators.kenning" = ["data/*.json", "data/*.sql", "data/*.yaml", "data/*.db"]
"wyrd.generators.kenning.lexicon.sql.migrations" = ["script.py.mako"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
