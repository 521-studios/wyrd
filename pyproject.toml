[project]
name = "wyrd"
version = "0.1.0"
description = "Random-generation service for TTRPG"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "click>=8.1",
    "apig-wsgi>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
wyrd = "wyrd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wyrd*"]

[tool.setuptools.package-data]
"wyrd.generators.kenning" = ["data/*.json"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
