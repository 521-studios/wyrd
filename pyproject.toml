[project]
name = "wyrd"
version = "0.1.0"
description = "Random-generation service for TTRPG"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "click>=8.1",
    "apig-wsgi>=2.18",
    # wyrd-el93: pure-Python reader for Hull's Domesday MDB files
    # (Microsoft Access format). Used only by ``lexicon ingest-domesday``
    # so the import is deferred to that command — other commands pay no
    # startup cost.
    "access_parser>=0.0.6",
    # wyrd-0vj3: S3 + zstd handling for bulk-source sync. Both imports
    # live behind ``lexicon fetch-bulk-sources`` / ``push-bulk-sources``
    # / ``verify-bulk-sources`` and the ``.jsonl.zst`` reader in
    # ``ingest-wiktionary``, so other CLI paths pay no startup cost.
    "boto3>=1.34",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # wyrd-0vj3: moto for offline S3 testing in bulk_sources tests.
    "moto[s3]>=5.0",
    "black>=24.0",
]

[project.scripts]
wyrd = "wyrd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wyrd*"]

[tool.setuptools.package-data]
"wyrd.generators.kenning" = ["data/*.json", "data/*.sql"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
