<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>wyrd</title>
    <link rel="stylesheet" href="style.__SHA__.css">
</head>
<body>
<header>
    <h1>wyrd</h1>
    <p class="tagline">Random generation for tabletop RPGs.</p>
</header>

<main>
    <div class="controls">
        <section id="picker">
            <label for="generator-select">Generator</label>
            <select id="generator-select"></select>
            <p id="generator-description" class="muted"></p>
        </section>

        <form id="params-form"></form>
    </div>

    <div class="results-col">
        <button id="roll" type="button">Roll</button>

        <section id="output" class="results-panel">
            <div id="about" hidden></div>
            <ol id="results"></ol>
            <p id="legend" class="muted small" hidden></p>
            <p id="seed-line" class="muted" hidden>
                seed:
                <code id="seed"></code>
                <button type="button" id="copy-link" class="link">copy share link</button>
            </p>
        </section>
    </div>
</main>

<script src="app.__SHA__.js"></script>
</body>
</html>
